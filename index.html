<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supply My Classroom - Northwood Public School</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fff;min-height:100vh;color:#1f2937}
        .container{max-width:1200px;margin:0 auto;padding:20px}
        .loading{text-align:center;padding:80px 20px;font-size:1.4rem;font-weight:600;background:linear-gradient(90deg,#4f46e5,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        h1{font-size:4.2rem;font-weight:900;text-align:center;margin-bottom:20px;background:linear-gradient(90deg,#4f46e5 0%,#7c3aed 50%,#ec4899 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleGlow 3s ease-in-out infinite alternate}
        h2{font-size:1.8rem;font-weight:700;margin-bottom:16px;color:#1f2937}
        @keyframes titleGlow{0%{text-shadow:0 4px 15px rgba(79,70,229,.2)}100%{text-shadow:0 6px 30px rgba(124,58,237,.4),0 0 60px rgba(236,72,153,.3)}}
        .header::after{content:'';display:block;width:140px;height:7px;background:linear-gradient(90deg,#4f46e5,#ec4899);margin:20px auto 0;border-radius:4px}
        .share-bar,.nav{display:flex;justify-content:center;gap:12px;margin-top:24px;flex-wrap:wrap}
  .share-btn,.nav-btn,.back-btn,.btn{background:#f3f4f6;color:#374151;border:1px solid #e5e7eb;padding:10px 16px;border-radius:9999px;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 2px 4px rgba(0,0,0,.05);font-size:.9rem;display:flex;align-items:center;gap:6px}
  /* compact square icon-only buttons */
  .share-btn.icon-only{padding:8px;width:44px;height:44px;justify-content:center;border-radius:10px}
  .share-btn.icon-only img,.share-btn.icon-only svg{width:20px;height:20px;display:block}
        .share-btn:hover,.nav-btn:hover,.back-btn:hover{background:#e5e7eb;transform:translateY(-1px)}
        .nav{margin-bottom:32px}
        .nav-btn.active{background:#4f46e5;color:white;border-color:#4f46e5}
  /* Brand colors and hover styles for share buttons */
  .share-btn.facebook{color:#1877F2}
  .share-btn.twitter{color:#1DA1F2}
  .share-btn.email{color:#6B7280}
  .share-btn.whatsapp{color:#25D366}
  .share-btn.facebook:hover{background:#1877F2;color:#fff;border-color:#1877F2}
  .share-btn.twitter:hover{background:#1DA1F2;color:#fff;border-color:#1DA1F2}
  .share-btn.email:hover{background:#6B7280;color:#fff;border-color:#6B7280}
  .share-btn.whatsapp:hover{background:#25D366;color:#fff;border-color:#25D366}
        .back-btn{padding:12px 20px;font-size:1rem;margin-bottom:24px}
        .select-container,.form-container,.wishlist-summary,.item-card,.disclosure{background:white;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.06);padding:24px;margin-bottom:24px}
        label{font-size:1.25rem;font-weight:600;color:#374151;margin-bottom:12px;display:block}
        select,.form-input,.form-textarea{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:8px;font-size:1rem;transition:all .2s}
        select:focus,.form-input:focus,.form-textarea:focus{outline:none;border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
        .item-card:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,.12)}
        .item-image{width:100%;height:297px;object-fit:cover;border-radius:8px;margin-bottom:16px}
        .quantity-container{display:flex;align-items:center;gap:8px;margin:12px 0}
        .quantity-btn{width:36px;height:36px;border:2px solid #e5e7eb;background:white;font-size:1.2rem;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer}
        .quantity{min-width:48px;text-align:center;font-weight:600}
        .wishlist-count{background:#4f46e5;color:white;padding:8px 16px;border-radius:9999px;font-weight:600}
        .total-price{background:linear-gradient(135deg,#10b981,#059669);color:white;padding:12px 20px;border-radius:9999px;font-weight:700;font-size:1.1rem}
        .buy-btn{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white}
        .add-to-wishlist{background:#10b981;color:white}
        .in-wishlist{background:#f59e0b;color:white}
        .clear-wishlist{background:#ef4444;color:white}
        .print-btn{background:#1f2937;color:white}
        .admin-btn{background:#6366f1;color:white}
        .disclosure{background:#f8f9ff;border:1px solid #e0e7ff;color:#4c1d95;text-align:center}
        .tab-container{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;border-bottom:2px solid #e5e7eb;padding-bottom:12px}
        .tab-btn{background:transparent;color:#6b7280;border:none;padding:8px 16px;cursor:pointer;font-weight:600;transition:all .2s}
        .tab-btn.active{color:#4f46e5;border-bottom:3px solid #4f46e5;margin-bottom:-14px}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
        .form-row.full{grid-template-columns:1fr}
        .img-preview{width:100px;height:100px;border:2px dashed #e5e7eb;border-radius:8px;object-fit:cover;margin-bottom:12px}
        @media(max-width:768px){h1{font-size:2.9rem}.header::after{width:90px;height:5px}.form-row{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div id="root"><div class="loading">Loading Supply My Classroom...</div></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Firebase SDK v9+ (modular) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
<script>
const {useState,useEffect}=React;
const STORAGE_KEY='supplyMyClassroom_data';
const PRODUCTS_STORAGE_KEY='supplyMyClassroom_products';
const AFFILIATE_TAG="wideen-20";
const BASE_URL="https://www.amazon.ca/dp";

// Firebase config (stored in localStorage to enable easy switching)
const FIREBASE_CONFIG_KEY='supplyMyClassroom_firebaseConfig';
const getFirebaseConfig=()=>JSON.parse(localStorage.getItem(FIREBASE_CONFIG_KEY)||'null');
const saveFirebaseConfig=(cfg)=>localStorage.setItem(FIREBASE_CONFIG_KEY,JSON.stringify(cfg));
let firebaseInitialized=false;
let db=null;

const initFirebase=(config)=>{
  try{
    if(!firebaseInitialized){
      firebase.initializeApp(config);
      firebaseInitialized=true;
      db=firebase.firestore();
    }
    return true;
  }catch(e){
    console.error('Firebase init error:',e);
    return false;
  }
};

const loadData=()=>{const d=localStorage.getItem(STORAGE_KEY);return d?JSON.parse(d):{teachers:[]}};
const saveData=d=>localStorage.setItem(STORAGE_KEY,JSON.stringify(d));
const loadProducts=()=>{const p=localStorage.getItem(PRODUCTS_STORAGE_KEY);return p?JSON.parse(p):null};
const saveProducts=p=>localStorage.setItem(PRODUCTS_STORAGE_KEY,JSON.stringify(p));

const defaultClassrooms=[{name:"Ms. Johnson – Grade 1",grade:"1",items:[{asin:"B07P5JVNX9",title:"Crayola Crayons 24-Pack",price:2.97,image:"https://m.media-amazon.com/images/I/81K3F9Q0MKL._AC_SY200_.jpg"},{asin:"B07MK6Q3RX",title:"Elmer's Glue Sticks 6-Pack",price:4.97,image:"https://m.media-amazon.com/images/I/71o3Z5Kk7JL._AC_SY200_.jpg"},{asin:"B01J8S2IWU",title:"Fiskars Kids Scissors",price:3.97,image:"https://m.media-amazon.com/images/I/71Q1qL2eZCL._AC_SY200_.jpg"}]},{name:"Mr. Singh – Grade 3",grade:"3",items:[{asin:"B07H4VBF6T",title:"Expo Dry-Erase Markers 8-Pack",price:9.97,image:"https://m.media-amazon.com/images/I/81N4K8g8M8L._AC_SY200_.jpg"},{asin:"B07C5NSB6R",title:"Sharpie Highlighters 12-Pack",price:7.97,image:"https://m.media-amazon.com/images/I/81K3F9Q0MKL._AC_SY200_.jpg"}]},{name:"Mme. Lefèvre – Grade 5 French Immersion",grade:"5",items:[{asin:"B08L5Y9Z3K",title:"Bescherelle Conjugation Book",price:14.95,image:"https://m.media-amazon.com/images/I/71o3Z5Kk7JL._AC_SY200_.jpg"}]},{name:"Ms. Chen – Grade 7 Science",grade:"7",items:[{asin:"B07K7P2X5Q",title:"Safety Goggles (12-Pack)",price:29.97,image:"https://m.media-amazon.com/images/I/81N4K8g8M8L._AC_SY200_.jpg"}]},{name:"Mr. Patel – Grade 9 Math",grade:"9",items:[{asin:"B07GZR2N7Q",title:"TI-30XS Calculator",price:19.97,image:"https://m.media-amazon.com/images/I/71Q1qL2eZCL._AC_SY200_.jpg"},{asin:"B01B4T5KJI",title:"Staedtler Geometry Set",price:8.47,image:"https://m.media-amazon.com/images/I/81K3F9Q0MKL._AC_SY200_.jpg"}]}];

function App(){
  const [page,setPage]=useState('store');
  const [data,setData]=useState(loadData());
  const [classrooms,setClassrooms]=useState(loadProducts()||defaultClassrooms);
  const [classroom,setClassroom]=useState('');
  const [wishlist,setWishlist]=useState([]);
  const [qty,setQty]=useState({});
  const [form,setForm]=useState({name:'',email:'',district:'',school:'',address:'',city:'',postalCode:'',grade:'',message:'',password:'',confirmPassword:''});
  const [status,setStatus]=useState(null);
  const [adminPassword,setAdminPassword]=useState('');
  const [adminLogged,setAdminLogged]=useState(false);
  const [adminTab,setAdminTab]=useState('registrations');
  const [productForm,setProductForm]=useState({classroomName:'',title:'',price:'',image:'',asin:''});
  const [editingProduct,setEditingProduct]=useState(null);
  const [loginEmail,setLoginEmail]=useState('');
  const [loginPassword,setLoginPassword]=useState('');
  const [resetEmail,setResetEmail]=useState('');
  const [resetToken,setResetToken]=useState('');
  const [resetNewPassword,setResetNewPassword]=useState('');
  const [resetConfirmPassword,setResetConfirmPassword]=useState('');
  const [resetDisplayToken,setResetDisplayToken]=useState('');
  const [loggedInTeacher,setLoggedInTeacher]=useState(null);

  const [firebaseConfig,setFirebaseConfig]=useState(getFirebaseConfig()||{apiKey:'',authDomain:'',projectId:'',storageBucket:'',messagingSenderId:'',appId:''});
  const [firebaseConfigMode,setFirebaseConfigMode]=useState(false);
  const [firebaseStatus,setFirebaseStatus]=useState('');

  const all=[...classrooms,...data.teachers];
  const items=all.find(c=>c.name===classroom)?.items||[];

  useEffect(()=>{if(all.length&&!classroom)setClassroom(all[0].name);
    all.forEach(c=>c.items?.forEach(i=>{i.link=`${BASE_URL}/${i.asin}?tag=${AFFILIATE_TAG}`;
      if(!qty[i.asin])qty[i.asin]=1;}));
    setQty({...qty});
  },[data.teachers,classroom,classrooms]);

  const fmt=p=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(p);
  const total=wishlist.reduce((s,i)=>s+i.price*(qty[i.asin]||1),0);
  const count=wishlist.reduce((s,i)=>s+(qty[i.asin]||1),0);

  // helper to hash passwords using SHA-256
  const hashString = async (str)=>{
    if(!str) return null;
    const enc=new TextEncoder().encode(str);
    const buf=await (crypto.subtle || crypto.webkitSubtle).digest('SHA-256',enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  };

  // simple password strength estimator (0-4)
  const passwordStrength = (pw)=>{
    if(!pw) return {score:0,label:'Too short'};
    let score=0;
    if(pw.length>=8) score++;
    if(/[A-Z]/.test(pw)) score++;
    if(/[0-9]/.test(pw)) score++;
    if(/[^A-Za-z0-9]/.test(pw)) score++;
    const labels=['Very weak','Weak','Okay','Strong','Very strong'];
    return {score, label: labels[Math.min(score,4)]};
  };

  // generate a short reset token (human-friendly)
  const generateResetToken = ()=>{
    // 6-digit numeric token
    return Math.floor(100000 + Math.random()*900000).toString();
  };

  // Firebase auth helpers (use Firebase if configured, else fall back to localStorage)
  const registerWithFirebase=async(email,password,userProfile)=>{
    const cfg=getFirebaseConfig();
    if(!cfg || !firebaseInitialized){
      // fallback: use localStorage
      return {success:false, method:'localStorage'};
    }
    try{
      const auth=firebase.auth();
      const cred=await auth.createUserWithEmailAndPassword(email,password);
      // store profile in Firestore
      await db.collection('users').doc(cred.user.uid).set({
        ...userProfile,
        email:email,
        uid:cred.user.uid,
        createdAt:new Date(),
        items:[]
      });
      return {success:true, uid:cred.user.uid, method:'firebase'};
    }catch(e){
      console.error('Firebase registration error:',e);
      return {success:false, error:e.message, method:'firebase'};
    }
  };

  const loginWithFirebase=async(email,password)=>{
    const cfg=getFirebaseConfig();
    if(!cfg || !firebaseInitialized){
      // fallback: use localStorage
      return {success:false, method:'localStorage'};
    }
    try{
      const auth=firebase.auth();
      const cred=await auth.signInWithEmailAndPassword(email,password);
      // load profile from Firestore
      const docSnap=await db.collection('users').doc(cred.user.uid).get();
      if(!docSnap.exists()){
        await auth.signOut();
        return {success:false, error:'User profile not found', method:'firebase'};
      }
      return {success:true, user:docSnap.data(), uid:cred.user.uid, method:'firebase'};
    }catch(e){
      console.error('Firebase login error:',e);
      return {success:false, error:e.message, method:'firebase'};
    }
  };

  const logoutWithFirebase=async()=>{
    const cfg=getFirebaseConfig();
    if(cfg && firebaseInitialized){
      try{
        await firebase.auth().signOut();
      }catch(e){console.error('Firebase logout error:',e);}
    }
  };

  const sendPasswordResetEmailWithFirebase=async(email)=>{
    const cfg=getFirebaseConfig();
    if(!cfg || !firebaseInitialized){
      return {success:false, method:'localStorage'};
    }
    try{
      const auth=firebase.auth();
      await auth.sendPasswordResetEmail(email);
      return {success:true, method:'firebase'};
    }catch(e){
      console.error('Firebase reset email error:',e);
      return {success:false, error:e.message, method:'firebase'};
    }
  };

  const toggle=async (i)=>{
    if(loggedInTeacher){
      // persist teacher's personal wishlist into their registration record
      const updatedTeachers=data.teachers.map(t=>{
        if(t.email===loggedInTeacher.email){
          const exists=(t.items||[]).some(x=>x.asin===i.asin);
          t.items = exists ? (t.items||[]).filter(x=>x.asin!==i.asin) : [...(t.items||[]), i];
        }
        return t;
      });
      const nd={teachers:updatedTeachers};
      setData(nd);saveData(nd);
      const updated = nd.teachers.find(t=>t.email===loggedInTeacher.email);
      setLoggedInTeacher(updated);
      setWishlist(updated.items||[]);
    } else {
      setWishlist(w=>w.some(x=>x.asin===i.asin)?w.filter(x=>x.asin!==i.asin):[...w,i]);
    }
  };
  const q=(a,d)=>setQty(p=>({...p,[a]:Math.max(1,(p[a]||1)+d)}));
  const clear=()=>{setWishlist([]);setQty({});};

  const share=p=>{
    const u=encodeURIComponent(location.href);
    const t=encodeURIComponent("Help supply my classroom!");
    const links={facebook:`https://www.facebook.com/sharer/sharer.php?u=${u}`,
      twitter:`https://twitter.com/intent/tweet?text=${t}&url=${u}`,
      email:`mailto:?subject=${t}&body=Check out this wishlist: ${u}`,
      whatsapp:`https://wa.me/?text=${t}%20${u}`};
    window.open(links[p],'_blank');
  };

  // Official SVG logos for share icons (Facebook, Twitter, Email, WhatsApp)
  const getIcon = (p) => {
    const common = {width:20,height:20,viewBox:'0 0 24 24',style:{flexShrink:0},'aria-hidden':true};
    if(p==='facebook'){
      // Facebook "f" glyph (single-color)
      return React.createElement('svg',common,
        React.createElement('path',{d:'M22 12.07C22 6.55 17.52 2 12 2S2 6.55 2 12.07c0 4.99 3.66 9.12 8.44 9.93v-7.03H8.08v-2.9h2.36V9.41c0-2.33 1.39-3.62 3.52-3.62 1.02 0 2.09.18 2.09.18v2.3h-1.18c-1.16 0-1.52.72-1.52 1.46v1.76h2.6l-.42 2.9h-2.18v7.03C18.34 21.19 22 17.06 22 12.07z',fill:'currentColor'})
      );
    }
    if(p==='twitter'){
      // Official X PNG from X brand toolkit used as the button image.
      // Source: https://about.x.com/en/who-we-are/brand-toolkit.html
      return React.createElement('img',{src:'https://about.x.com/content/dam/about-twitter/x/large-x-logo.png.twimg.1920.png',alt:'X',width:20,height:20,style:{display:'block',flexShrink:0}});
    }
    if(p==='email'){
      // Envelope glyph
      return React.createElement('svg',common,
        React.createElement('path',{d:'M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z',fill:'currentColor'})
      );
    }
    if(p==='whatsapp'){
      // WhatsApp glyph: simplified phone in speech bubble
      return React.createElement('svg',common,
        React.createElement('path',{d:'M20.52 3.48A11.9 11.9 0 0 0 12 0C5.37 0 .02 4.91.02 11.07c0 1.95.51 3.86 1.48 5.56L0 24l7.62-2.01A11.48 11.48 0 0 0 12 23.07c6.63 0 12-4.91 12-11.07 0-2.96-1.2-5.74-3.48-7.34zM17.1 15.02c-.27-.14-1.6-.79-1.85-.88-.25-.09-.43-.14-.62.14-.18.27-.7.88-.86 1.06-.16.18-.32.2-.6.07-.28-.13-1.18-.43-2.25-1.39-.83-.74-1.38-1.66-1.55-1.95-.16-.29-.02-.45.12-.59.12-.12.28-.31.42-.47.14-.16.18-.27.27-.45.08-.18.04-.34-.02-.47-.07-.13-.6-1.45-.82-1.98-.22-.52-.44-.45-.6-.46l-.51-.01c-.16 0-.4.06-.58.29-.18.23-.7.71-.7 1.72s.68 2.09.78 2.29c.1.2 1.7 2.64 4.12 3.99 2.42 1.35 2.42 0.9 2.86 0.84.44-.06 1.45-.59 1.65-1.16.2-.57.2-1.06.14-1.16-.06-.1-.25-.16-.52-.29z',fill:'currentColor'})
      );
    }
    return React.createElement('svg',common,React.createElement('rect',{width:24,height:24,fill:'currentColor'}));
  };

  const deleteTeacher=idx=>{const updated={teachers:data.teachers.filter((_,i)=>i!==idx)};setData(updated);saveData(updated);};
  const exportCSV=()=>{const csv=['Name,Grade,District,School,Address,City,Postal Code,Email,Message'].concat(data.teachers.map(t=>`"${t.name}","${t.grade}","${t.district||''}","${t.school||''}","${t.address||''}","${t.city||''}","${t.postalCode||''}","${t.email||''}","${t.message||''}"`)).join('\n');const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='teacher-registrations.csv';a.click();};
  // Export a minimal JSON for migration (no password hashes)
  const exportForMigration=()=>{const exportData=data.teachers.map(t=>({name:t.name,email:t.email,grade:t.grade,school:t.school,district:t.district}));const blob=new Blob([JSON.stringify(exportData,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='teachers-for-migration.json';a.click();};
  
  const addOrUpdateProduct=()=>{
    if(!productForm.classroomName||!productForm.title||!productForm.price||!productForm.asin){alert('Please fill in all required fields');return;}
    const updated=classrooms.map(c=>{
      if(c.name===productForm.classroomName){
        if(editingProduct!==null){c.items[editingProduct]={...productForm,price:parseFloat(productForm.price)};setEditingProduct(null);}
        else{c.items=[...c.items,{...productForm,price:parseFloat(productForm.price)}];}
      }
      return c;
    });
    setClassrooms(updated);saveProducts(updated);setProductForm({classroomName:'',title:'',price:'',image:'',asin:''});setStatus('ok');setTimeout(()=>setStatus(null),2000);
  };
  
  const deleteProduct=(classroomName,idx)=>{
    const updated=classrooms.map(c=>{if(c.name===classroomName){c.items=c.items.filter((_,i)=>i!==idx);}return c;});
    setClassrooms(updated);saveProducts(updated);
  };
  
  const deleteClassroom=(classroomName)=>{
    const updated=classrooms.filter(c=>c.name!==classroomName);
    setClassrooms(updated);saveProducts(updated);setStatus('ok');setTimeout(()=>setStatus(null),2000);
  };
  
  const adminLogin=()=>{if(adminPassword==='admin123'){setAdminLogged(true);setAdminPassword('');}else{alert('Incorrect password')}};
  const adminLogout=()=>{setAdminLogged(false);setAdminPassword('');setPage('store');};
  
  const teacherLogin=async(email,password)=>{
    // try Firebase first
    const fbResult=await loginWithFirebase(email,password);
    if(fbResult.method==='firebase'){
      if(fbResult.success){
        setLoggedInTeacher(fbResult.user);
        setLoginEmail('');setLoginPassword('');
        setWishlist(fbResult.user.items||[]);
        const nq={...qty};(fbResult.user.items||[]).forEach(i=>{if(!nq[i.asin])nq[i.asin]=1;});setQty(nq);
        setStatus('ok');setTimeout(()=>setStatus(null),2000);
      }else{
        alert('Login failed: '+(fbResult.error||'unknown error'));
      }
    } else {
      // localStorage fallback
      const idx=data.teachers.findIndex(t=>t.email===email);
      if(idx===-1){alert('Email not found. Please check or register first.');return;}
      const found=data.teachers[idx];
      if(!found.passwordHash){alert('This account does not have a password set.');return;}
      const h = await hashString(password);
      if(h===found.passwordHash){
        setLoggedInTeacher(found);
        setLoginEmail('');setLoginPassword('');

            React.createElement('input',{type:'password',className:'form-input',required:true,value:form.confirmPassword,onChange:e=>setForm({...form,confirmPassword:e.target.value}),placeholder:'Re-enter password'})
          ),
          React.createElement('div',{style:{marginBottom:'20px'}},
            React.createElement('label',null,'Message (optional)'),
            React.createElement('textarea',{className:'form-textarea',rows:4,value:form.message,onChange:e=>setForm({...form,message:e.target.value})})
          ),
          React.createElement('button',{type:'submit',className:'btn buy-btn',style:{width:'100%',padding:'14px'}},'Create My Wishlist')
        )
      )
    );
  }

  return React.createElement('div',{className:'container'},
    React.createElement('div',{className:'header'},
      React.createElement('h1',null,'Supply My Classroom'),
      React.createElement('div',{className:'share-bar'},
        ['facebook','twitter','email','whatsapp'].map(p=>React.createElement('button',{key:p,className:'share-btn '+p+' icon-only','aria-label':'Share on '+(p==='email'?'Email':(p==='twitter'?'X':p[0].toUpperCase()+p.slice(1))),onClick:()=>share(p)},
          getIcon(p)
        ))
      )
    ),
    React.createElement('div',{className:'nav'},
      React.createElement('button',{className:`nav-btn ${page==='store'?'active':''}`,onClick:()=>setPage('store')},'Store'),
      React.createElement('button',{className:`nav-btn ${page==='register'?'active':''}`,onClick:()=>setPage('register')},'Register'),
      React.createElement('button',{className:`nav-btn ${page==='teacherLogin'?'active':''}`,onClick:()=>setPage('teacherLogin')},'Teacher Login'),
      React.createElement('button',{className:`nav-btn ${page==='admin'?'active':''}`,onClick:()=>setPage('admin')},'Admin')
    ),
    React.createElement('div',{className:'select-container'},
      React.createElement('label',null,'Choose a classroom to supply'),
      React.createElement('select',{value:classroom,onChange:e=>setClassroom(e.target.value)},
        all.map(c=>React.createElement('option',{key:c.name,value:c.name},c.name))
      )
    ),
    React.createElement('div',{className:'grid'},
      items.map(i=>React.createElement('div',{key:i.asin,className:'item-card'},
        React.createElement('img',{src:i.image,alt:i.title,className:'item-image',onError:e=>{e.target.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22297%22 height=%22297%22%3E%3Crect fill=%22%23e5e7eb%22 width=%22297%22 height=%22297%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 font-size=%2216%22 fill=%22%236b7280%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22%3EImage not found%3C/text%3E%3C/svg%3E'}}),
        React.createElement('h3',{style:{fontSize:'1.1rem',marginBottom:'8px'}},i.title),
        React.createElement('p',{style:{fontWeight:700,color:'#10b981',marginBottom:'12px'}},fmt(i.price)),
        React.createElement('div',{className:'quantity-container'},
          React.createElement('button',{className:'quantity-btn',onClick:()=>q(i.asin,-1)},'−'),
          React.createElement('span',{className:'quantity'},qty[i.asin]||1),
          React.createElement('button',{className:'quantity-btn',onClick:()=>q(i.asin,1)},'+')
        ),
        React.createElement('button',{className:`btn ${wishlist.some(x=>x.asin===i.asin)?'in-wishlist':'add-to-wishlist'}`,style:{width:'100%'},onClick:()=>toggle(i)},
          wishlist.some(x=>x.asin===i.asin)?'✓ In Wishlist':'Add to Wishlist')
      ))
    ),
    wishlist.length>0&&React.createElement('div',{className:'wishlist-summary'},
      React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px'}},
        React.createElement('span',{className:'wishlist-count'},`${count} item${count>1?'s':''}`),
        React.createElement('span',{className:'total-price'},fmt(total))
      ),
      React.createElement('div',{style:{display:'flex',gap:'12px',flexWrap:'wrap'}},
        React.createElement('a',{href:`https://www.amazon.ca/gp/aws/cart/add.html?${wishlist.map(i=>`ASIN.${i.asin}=${qty[i.asin]||1}&AssociateTag=${AFFILIATE_TAG}`).join('&')}`,target:'_blank',className:'btn buy-btn'},'Buy All on Amazon →'),
        React.createElement('button',{onClick:clear,className:'btn clear-wishlist'},'Clear'),
        React.createElement('button',{onClick:()=>window.print(),className:'btn print-btn'},'Print')
      )
    ),
    React.createElement('div',{className:'disclosure'},
      React.createElement('small',null,'We are an Amazon Associate and earn from qualifying purchases. Prices in CAD.')
    )
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
